rules:
  # ------------------------------------------------------------ QC manual 4.1 General errors
  - id: DRM-GEN-01
    title: Drawing file name follows Zone-Sector-Plot-Building-Floor, hyphen separated
    qc_error: Incorrect Drawing File Name
    evidence: VERIFIED_SPEC
    ref: {page: "8-12", section: "SPEC 1.3; QCM 4.1 #1"}
    severity: ERROR
    check: bdms.filename
    implementation: IMPLEMENTED
  - id: DRM-GEN-02
    title: Floor ID in the file name is G, Fn, Mn or Bn (n positive integer)
    qc_error: Incorrect Floor ID in the file Name
    evidence: VERIFIED_SPEC
    ref: {page: "11-12", section: "SPEC Table 2; QCM 4.1 #2, 4.4 #12"}
    severity: ERROR
    check: bdms.filename
    implementation: IMPLEMENTED
  - id: DRM-GEN-03
    title: Drawing is in the DRM coordinate system (WGS 84 / UTM 39N or 40N, metres)
    qc_error: The drawing is not in the correct (coordinate) system
    evidence: VERIFIED_SPEC
    ref: {page: 8, section: "SPEC 1.2; QCM 4.1 #3"}
    severity: ERROR
    check: crs.declared
    implementation: PARTIAL
    limitation: The exact test the QC tool applies is not documented; the tool checks the confirmed declaration and the extent plausibility.
  - id: DRM-GEN-04
    title: ZoneName / SectorNumber belong to the official lists embedded in the QC tool
    qc_error: Incorrect ZoneName / SectorNumber found in the file name
    evidence: PENDING_OFFICIAL_CONFIRMATION
    ref: {page: 11, section: "QCM 4.1 #4-5"}
    severity: INFO
    check: bdms.official_lists
    implementation: NOT_IMPLEMENTED
    limitation: The official zone and sector lists are compiled into the .FAS and are not published; only consistency between file name and PlotDetail is checked (DRM-ATT-06).
  - id: DRM-GEN-06
    title: Only specified layers exist in the drawing
    qc_error: Non specified layer/s found
    evidence: VERIFIED_SPEC
    ref: {page: 17, section: "SPEC 1.4.6; QCM 4.1 #6"}
    severity: WARNING
    check: mapping.unknown_layers
    implementation: IMPLEMENTED
    limitation: Unknown layers are queued for mapping and left out of the prepared file; foreign layer-table records are removed from the output (logged) and the output is re-checked.
  - id: DRM-GEN-07
    title: A layer with polygons has its attribute blocks
    qc_error: Attribute Block is missing
    evidence: VERIFIED_SPEC
    ref: {page: 11, section: "QCM 4.1 #7"}
    severity: ERROR
    check: bdms.layer_pairs
    implementation: IMPLEMENTED
  - id: DRM-GEN-08
    title: A layer present in the drawing contains its polygons
    qc_error: Mandatory Polygon is missing
    evidence: VERIFIED_SPEC
    ref: {page: 11, section: "QCM 4.1 #8"}
    severity: ERROR
    check: bdms.layer_pairs
    implementation: IMPLEMENTED
    limitation: Empty specified layers are removed from the prepared file (SAMPLES contain only populated layers).
  # ------------------------------------------------------------ QC manual 4.2 Attribute errors
  - id: DRM-ATT-01
    title: Exactly one attribute block per polygon
    qc_error: Multiple Attribute Blocks found in a single polygon / Polygon with missing Attribute Block found
    evidence: VERIFIED_SPEC
    ref: {page: 12, section: "QCM 4.2 #1-2; 4.4 #1"}
    severity: ERROR
    check: attributes.one_per_feature
    implementation: IMPLEMENTED
  - id: DRM-ATT-02
    title: Attribute block insertion point inside its polygon and not at 0,0
    qc_error: Polygon with missing Attribute Block found
    evidence: VERIFIED_SPEC
    ref: {page: 18, section: "SPEC 1.4.6 rule 6"}
    severity: ERROR
    check: attributes.inside_polygon
    implementation: IMPLEMENTED
  - id: DRM-ATT-03
    title: Mandatory attribute fields have values
    qc_error: Missing Value in the Attribute Block Mandatory Fields
    evidence: VERIFIED_SPEC
    ref: {page: 12, section: "QCM 4.2 #3; SPEC 1.4.6.1"}
    severity: ERROR
    check: attributes.mandatory
    implementation: IMPLEMENTED
  - id: DRM-ATT-04
    title: UnitNumber unique in the floor
    qc_error: Duplicate UnitNumber found in UnitDetail attribute block
    evidence: VERIFIED_SPEC
    ref: {page: 12, section: "QCM 4.2 #4; SPEC 1.4.6.1.8 #2,#4"}
    severity: ERROR
    check: bdms.unique_ids
    implementation: IMPLEMENTED
    limitation: Uniqueness across the whole building (all floor files) needs all floors in one run; checked per file.
  - id: DRM-ATT-05
    title: SpaceNumber unique in the floor
    qc_error: Duplicate Floor SpaceNumber found in SpaceDetail
    evidence: VERIFIED_SPEC
    ref: {page: 12, section: "QCM 4.2 #5, #33"}
    severity: ERROR
    check: bdms.unique_ids
    implementation: IMPLEMENTED
  - id: DRM-ATT-06
    title: ZoneName and SectorNumber in PlotDetail match the file name
    qc_error: Inconsistent ZoneName / SectorNumber found between File Name and PlotDetail attribute block
    evidence: VERIFIED_SPEC
    ref: {page: "12-13", section: "QCM 4.2 #6-7, #17-18"}
    severity: ERROR
    check: bdms.consistency
    implementation: IMPLEMENTED
  - id: DRM-ATT-08
    title: UnitNumber in Space/Door/Window details refers to an existing unit
    qc_error: Space/Door/Window with incorrect UnitNumber found
    evidence: VERIFIED_SPEC
    ref: {page: 12, section: "QCM 4.2 #8-10"}
    severity: ERROR
    check: bdms.references
    implementation: IMPLEMENTED
  - id: DRM-ATT-11
    title: FloorNumber in Space/Unit/Door/Window details equals the FloorDetail floor number
    qc_error: Incorrect FloorNumber found in Space/Unit/Door/WindowDetail attribute block
    evidence: VERIFIED_SPEC
    ref: {page: "12-13", section: "QCM 4.2 #11-14; 4.4 #9"}
    severity: ERROR
    check: bdms.consistency
    implementation: IMPLEMENTED
  - id: DRM-ATT-15
    title: SpaceNumber in Door/Window details refers to an existing space
    qc_error: Door/Window with incorrect SpaceNumber found
    evidence: VERIFIED_SPEC
    ref: {page: "13-14", section: "QCM 4.2 #15-16, #24-25"}
    severity: ERROR
    check: bdms.references
    implementation: IMPLEMENTED
  - id: DRM-ATT-19
    title: BuildingNumber consistent between file name, ProjectDetail, BuildingDetail, FloorDetail and BuildingRoofDetail
    qc_error: Inconsistent BuildingNumber found between drawing File Name and ProjectDetail / BuildingDetail
    evidence: VERIFIED_SPEC
    ref: {page: 13, section: "QCM 4.2 #19-22; 4.4 #8, #10"}
    severity: ERROR
    check: bdms.consistency
    implementation: IMPLEMENTED
  - id: DRM-ATT-26
    title: Attribute values have the specified type and length (numbers, dates, Char(n))
    qc_error: Incorrect data entry found in Unit/Building/Floor/BuildingRoofDetail attribute block
    evidence: VERIFIED_SPEC
