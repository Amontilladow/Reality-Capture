# M4 GIS Preparation - rule manifest, profile "bdms_building"
#
# Sources (official attachments supplied by M4 on 2026-10-26, kept locally in reference/, not committed):
#   SPEC  "Building Data Delivery Specification (BDMS 4.1)" - Al Dhafra Municipality (DRM) / ADM SDD,
#         "Modified to support DRM V4.1 2021/01/26", file BDMS 4.1 Standards for DRM_270121.pdf (31 pages)
#   QCM   "BDMS 4.1 QC Manual" for DRM_CPDQC_V2.3.fas, file DRM_CPDQC_V2.3_UserManual.pdf (39 pages)
#   UPC   UPC_Land Use Classification.xls (Appendix C)
#   SAMPLES  four ADM-approved (official-QC-passed) drawings KHALIFA CITY-SE45_01-C8-1-{G,F1,F2,F3}.dxf
# Page numbers: SPEC printed footer page; QCM "Page n of 39".
# Where the SAMPLES contradict the SPEC text, the behaviour of the official QC (as evidenced by the
# accepted samples) is followed and the conflict is recorded in docs/DISCREPANCIES_BDMS.md.

profile: bdms_building

spec:
  id: DRM-BDMS
  title: Building Data Delivery Specification (BDMS 4.1) - Building Construction CAD Data Delivery Standards
  issuer: Al Dhafra Municipality (DRM) / Abu Dhabi Municipality Spatial Data Division
  version: "4.1"
  revision_date: "2021/01/26"
  source_pdf: BDMS 4.1 Standards for DRM_270121.pdf
  source_pdf_sha256: 63502036084d79a063c5d9369e4f2d1dee58b08b4b33dce6d0aa464b88122814
  source_pdf_pages: 31
  qc_manual: DRM_CPDQC_V2.3_UserManual.pdf
  qc_manual_sha256: 1717cad958ee95208ca65e6493086609ad4964d9aa7ac76138ec45ee96683aed
  qc_tool: DRM_CPDQC_V2.3.fas
  qc_tool_sha256: e250d5c28934734e5c066fbb667eec13bc020dc31ba08912a211ec1e3e6418c8
  manifest_schema: 1
  manifest_revision: 1
  extracted_on: "2026-10-26"
  codelists_file: drm_bdms_v4.1_codelists.yaml

output:
  required_format: DWG
  min_autocad_release: "2006"
  min_version_code: AC1018
  max_version_code: null
  ref: {page: 14, section: "1.4.1"}
  produced_format: DXF
  produced_dxf_version: R2010
  create_empty_layers: false        # SAMPLES: layers without content are absent (QC "Mandatory Polygon is missing")
  layer_table_extra_allowed: ["0", "Defpoints"]   # present in every accepted sample
  purge_foreign_layers: true        # QC 4.1 #6 "Non specified layer/s found"
  one_file_per: floor

units:
  insunits: null                    # not enforced: SAMPLES carry $INSUNITS=4 (mm) with metre coordinates
  lunits: null
  description: >-
    SPEC §1.4.2 says one drawing unit equals one centimetre, but the official-QC-passed SAMPLES are drawn
    in metres (UTM 40N coordinates, 63.6 m building). Geometry must be in metres to be in UTM; the engineer
    confirms it. See DISCREPANCIES_BDMS B-01.
  ref: {page: 14, section: "1.4.2"}

crs:
  target_epsg: 32640
  allowed_epsg: [32639, 32640]
  name: WGS 84 / UTM zone 39N or 40N (by building location)
  ref: {page: 8, section: "1.2"}
  plausibility_window_lonlat: {min_lon: 51.0, max_lon: 56.5, min_lat: 22.4, max_lat: 25.5}

filename:
  kind: bdms
  pattern: "<ZoneName>-<SectorNumber>-<PlotNumber>-<BuildingNumber>-<FloorID>.dwg"
  separator: "-"
  floor_id_regex: "^(G|[FMB][1-9][0-9]*)$"
  building_id_regex: "^[1-9][0-9]*$"
  extension: .dwg
  ref: {page: "8-12", section: "1.3"}
  examples: [AbuDhabi-E_1-C_1-1-F1.dwg, AbuDhabi-E_1-C_1-1-G.dwg, AbuDhabi-E_1-C_1-1-B1.dwg, AbuDhabi-E_1-C_1-1-M1.dwg]

title_block: null                    # BDMS uses ProjectDetail + DrawingDetail, checked by validate.bdms
title_blocks:
  layer: Title
  required: [ProjectDetail, DrawingDetail]
  ref: {page: "15-16", section: "1.4.5"}

prohibited_entities: [HATCH, SOLID, XLINE, LINE, MPOLYGON, DIMENSION, ARC_DIMENSION, LEADER, MLEADER, MULTILEADER, POINT, RAY, TRACE, MLINE]
cross_layer_snapping: [BuildingOutline, Floor, Space, Unit, Window, Door]   # QCM 4.5

categories:
  building:
    label: Building floor
    file_token: floor
    ref: {page: "17-18", section: "1.4.6", table: "Table 1"}
    layers:
      - {name: BuildingOutline, topology: polyline, constraint: closed, color: 6, linetype: Continuous, lineweight: default, lineweight_accept: [25], detail: BuildingDetail}
      - {name: BuildingDetail, topology: point, constraint: attribute_block, color: 6, linetype: Continuous, lineweight: default, lineweight_accept: [25], parent: BuildingOutline, block: BuildingDetail}
      - {name: BuildingRoof, topology: polyline, constraint: closed, color: 32, linetype: Continuous, lineweight: default, lineweight_accept: [25], detail: BuildingRoofDetail}
      - {name: BuildingRoofDetail, topology: point, constraint: attribute_block, color: 32, linetype: Continuous, lineweight: default, lineweight_accept: [25], parent: BuildingRoof, block: BuildingRoofDetail}
      - {name: Plot, topology: polyline, constraint: closed, color: 51, linetype: Continuous, lineweight: default, lineweight_accept: [25], detail: PlotDetail}
      - {name: PlotDetail, topology: point, constraint: attribute_block, color: 51, linetype: Continuous, lineweight: default, lineweight_accept: [25], parent: Plot, block: PlotDetail}
      - {name: Floor, topology: polyline, constraint: closed, color: 4, linetype: Continuous, lineweight: default, lineweight_accept: [25], detail: FloorDetail}
      - {name: FloorDetail, topology: point, constraint: attribute_block, color: 4, linetype: Continuous, lineweight: default, lineweight_accept: [25], parent: Floor, block: FloorDetail}
      - {name: Space, topology: polyline, constraint: closed, color: 3, linetype: Continuous, lineweight: default, lineweight_accept: [25], detail: SpaceDetail, nesting_levels: 1}
      - {name: SpaceDetail, topology: point, constraint: attribute_block, color: 3, linetype: Continuous, lineweight: default, lineweight_accept: [25], parent: Space, block: SpaceDetail}
      - {name: Unit, topology: polyline, constraint: closed, color: 5, linetype: Continuous, lineweight: default, lineweight_accept: [25], detail: UnitDetail}
      - {name: UnitDetail, topology: point, constraint: attribute_block, color: 5, linetype: Continuous, lineweight: default, lineweight_accept: [25], parent: Unit, block: UnitDetail}
      - {name: Door, topology: polyline, constraint: closed, color: 181, linetype: Continuous, lineweight: default, lineweight_accept: [25], detail: DoorDetail}
      - {name: DoorDetail, topology: point, constraint: attribute_block, color: 181, linetype: Continuous, lineweight: default, lineweight_accept: [25], parent: Door, block: DoorDetail}
      - {name: Window, topology: polyline, constraint: closed, color: 57, linetype: Continuous, lineweight: default, lineweight_accept: [25], detail: WindowDetail}
      - {name: WindowDetail, topology: point, constraint: attribute_block, color: 57, linetype: Continuous, lineweight: default, lineweight_accept: [25], parent: Window, block: WindowDetail}
      - {name: SharedSpace, topology: polyline, constraint: closed, color: 2, linetype: Continuous, lineweight: default, lineweight_accept: [25], detail: SharedSpaceDetail}
      - {name: SharedSpaceDetail, topology: point, constraint: attribute_block, color: 2, linetype: Continuous, lineweight: default, lineweight_accept: [25], parent: SharedSpace, block: SharedSpaceDetail}
      - {name: Miscellaneous, topology: mixed, constraint: none, color: 7, linetype: Continuous, lineweight: default, lineweight_accept: [25]}
      - {name: Title, topology: mixed, constraint: none, color: 7, linetype: Continuous, lineweight: default, lineweight_accept: [25]}

domains:
  usage_category_type: [Agricultural, Cultural, Commercial, CommercialResidential, Diplomatic, Educational, Governmental, Health, Industrial, Recreational, Religious, Residential, Utility, PublicFacility, Undefined]
  # QCM Appendix 1 lists 2 (UsageType) and 3 (UnitType); spelling kept exactly as printed (e.g. "Inrastructure", "Employee Hosing").
  usage_type: [Residential, Commercial, Industrial, Community Services, Open Space and Recreation, Inrastructure, Agricultural, Household Living, Institutional Living, Employee Hosing, Labor Housing, Palace Residential, Mixed-use Residential, Single-use Commercial, Mixed-use Commercial, City Serving Industrial, Research & Development, General Industrial, Heavy Industrial, Public & Institutional, Educational, Healthcare, Religious, General Community Services, Developed Open Space, Natural Open Space, Archeological, Transportation, Utilities, Farm, Poultry/Broiler Operation, Dairy Livestock Facility, Abbatoir, Ranch, Other]
  unit_type: [Residential, Commercial, Industrial, Community Services, Open Space and Recreation, Inrastructure, Agricultural, Household Living, Institutional Living, Employee Hosing, Labor Housing, Palace Residential, Mixed-use Residential, Single-use Commercial, Mixed-use Commercial, City Serving Industrial, Research & Development, General Industrial, Heavy Industrial, Public & Institutional, Educational, Healthcare, Religious, General Community Services, Developed Open Space, Natural Open Space, Archeological, Transportation, Utilities, Farm, Poultry/Broiler Operation, Dairy Livestock Facility, Abbatoir, Ranch, Other]
  drawing_type: [As Planned, As Built, Modification]
  unit_classification_suggested: [Studio Flat, Bungalow, Duplex, Penthouse, Apartment, Guest House, Shop, Office, Building, Business Centre, Hall, Hotel, Restaurant, Cinema, Showroom, Warehouse]

blocks:
  BuildingDetail:
    ref: {page: "19-20", section: "1.4.6.1.1"}
    attributes:
      - {tag: BuildingNumber, type: integer, mandatory: true, max_length: 10}
      - {tag: BuildingNameEnglish, type: character, mandatory: false, max_length: 200}
      - {tag: BuildingNameArabic, type: character, mandatory: false, max_length: 200}
      - {tag: BuildingPopNameEng, type: character, mandatory: false, max_length: 200}
      - {tag: BuildingPopNameAra, type: character, mandatory: false, max_length: 200}
      - {tag: BuildingNumOfFloors, type: integer, mandatory: true}
      - {tag: UsageCategoryType, type: character, mandatory: true, max_length: 30, domain: usage_category_type}
      - {tag: UsageType, type: character, mandatory: true, max_length: 30, domain: usage_type}
      - {tag: PlotNumber, type: character, mandatory: true, max_length: 25}
      - {tag: SectorNumber, type: character, mandatory: true, max_length: 50}
  PlotDetail:
    ref: {page: "20-21", section: "1.4.6.1.2"}
    attributes:
      - {tag: PlotNumber, type: character, mandatory: true, max_length: 25}
      - {tag: SectorNumber, type: character, mandatory: true, max_length: 100}
      - {tag: ZoneName, type: character, mandatory: true, max_length: 200}
  FloorDetail:
    ref: {page: 21, section: "1.4.6.1.3"}
    attributes:
      - {tag: FloorNumber, type: character, mandatory: true, max_length: 10}
      - {tag: BuildingNumber, type: integer, mandatory: true, max_length: 10}
      - {tag: FloorHeight, type: float, mandatory: true}
  # Not described in SPEC; structure from the official template blocks as found in every SAMPLE.
  BuildingRoofDetail:
    ref: {page: 17, section: "1.4.6 (template)"}
    attributes:
      - {tag: BuildingNumber, type: integer, mandatory: true, max_length: 10}
      - {tag: BuildingHeight, type: float, mandatory: false}
  UnitDetail:
    ref: {page: "21-22", section: "1.4.6.1.4"}
    attributes:
      - {tag: UnitNumber, type: integer, mandatory: true, max_length: 10}
      - {tag: FloorNumber, type: character, mandatory: true, max_length: 10}
      - {tag: UnitType, type: character, mandatory: true, max_length: 50, domain: unit_type}
      - {tag: UnitClassification, type: character, mandatory: true, max_length: 50}
      - {tag: UnitCategory, type: character, mandatory: false, max_length: 25}
      - {tag: UnitArea, type: number, mandatory: true, max_length: 10}
      - {tag: UnitNumBedroom, type: integer, mandatory: true, max_length: 10}
      - {tag: UnitNumBathroom, type: integer, mandatory: true, max_length: 10}
      - {tag: UnitBalconiesArea, type: number, mandatory: false, max_length: 10}
      - {tag: UnitUsageType, type: character, mandatory: true, max_length: 50}
      - {tag: UnitOwnerName, type: character, mandatory: true, max_length: 50}
      - {tag: UnitOwnerNatioanlity, type: character, mandatory: true, max_length: 50}
      - {tag: UnitOwnerPassport, type: character, mandatory: true, max_length: 25}
  SpaceDetail:
    ref: {page: "22-23", section: "1.4.6.1.5"}
    attributes:
      - {tag: SpaceNumber, type: integer, mandatory: true, max_length: 10}
      - {tag: UnitNumber, type: integer, mandatory: false, max_length: 10}
      - {tag: FloorNumber, type: character, mandatory: true, max_length: 10}
      - {tag: Spaceusage, type: character, mandatory: true, max_length: 50}
  DoorDetail:
    ref: {page: 23, section: "1.4.6.1.6"}
    attributes:
      - {tag: SpaceNumber, type: integer, mandatory: true, max_length: 10}
      - {tag: UnitNumber, type: integer, mandatory: false, max_length: 10}
      - {tag: FloorNumber, type: character, mandatory: true, max_length: 10}
      - {tag: Type, type: character, mandatory: false, max_length: 50}
  WindowDetail:
    ref: {page: 23, section: "1.4.6.1.7"}
    attributes:
      - {tag: SpaceNumber, type: integer, mandatory: true, max_length: 10}
      - {tag: UnitNumber, type: integer, mandatory: false, max_length: 10}
      - {tag: FloorNumber, type: character, mandatory: true, max_length: 10}
      - {tag: Type, type: character, mandatory: false, max_length: 50}
  SharedSpaceDetail:
    ref: {page: "27-29", section: "Appendix F"}
    attributes:
      - {tag: SpaceNumber, type: integer, mandatory: true, max_length: 10}
      - {tag: Spaceusage, type: character, mandatory: true, max_length: 50}
      - {tag: BelongToBuildingNumber, type: character, mandatory: false, max_length: 10}
      - {tag: BelongToFloorNumber, type: character, mandatory: false, max_length: 10}
      - {tag: BelongToUnitNumber, type: character, mandatory: false, max_length: 10}
      - {tag: LinkToBuildingNumber, type: character, mandatory: true}
      - {tag: LinkToFloorNumber, type: character, mandatory: false}
      - {tag: LinkToUnitNumber, type: character, mandatory: false}
      - {tag: LinkToSpaceNumber, type: character, mandatory: false}
  ProjectDetail:
    ref: {page: 15, section: "1.4.5"}
    attributes:
      - {tag: DeveloperName, type: character, mandatory: true}
      - {tag: PropertyName, type: character, mandatory: false}
      - {tag: UniqueBuildingNumber, type: integer, mandatory: true}
      - {tag: BuildingName, type: character, mandatory: false}
  DrawingDetail:
    ref: {page: "15-16", section: "1.4.5"}
    attributes:
      - {tag: DrawingTitle, type: character, mandatory: true}
      - {tag: DrawingType, type: character, mandatory: true, domain: drawing_type}
      - {tag: DateOfDrawing, type: date, mandatory: true}
      - {tag: DrawingScale, type: number, mandatory: false}

# QC snapping tolerance is "0.0000" (QCM p20): coordinates are compared to four decimals.
tolerances:
  coincidence: 0.0001
  snap_search: 0.01
  zero_length: 0.0001
  overlap_area: 0.0001
  arc_sagitta: 0.01
  attribute_vertex: 0.0001

