<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reality Capture by EngineeringOS</title>
    <meta name="description" content="Reality Capture by EngineeringOS — site documentation, BIM coordination, and issue tracking for construction projects." />

    <!-- The root ("/") is now a real public marketing page (see
         PublicLandingPage.tsx) -- every other route still requires login or
         is a private, token-gated share link, which is what robots.txt's
         per-path Disallow rules now express instead of this blanket tag. -->

    <!-- A single-page app has one static index.html shared by every route
         (client-side routing, no per-route SSR), so a self-referencing
         canonical can only point at the app's root, not the current route
         -- there is no server-rendered alternative to deep-link to anyway,
         since every other route requires a login redirect or is a private,
         token-gated share link (never meant for public discovery). -->
    <link rel="canonical" href="https://engineeringos-web.onrender.com/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Generic, site-wide only -- there's no per-route SSR to vary these
         by page (see the canonical comment above), so this is what shows
         if any link into the app is ever pasted somewhere with a link
         preview (e.g. the public landing page itself, or the token-gated
         RFI/progress-report share links). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Reality Capture" />
    <meta property="og:title" content="Reality Capture by EngineeringOS" />
    <meta property="og:description" content="Site documentation, BIM coordination, and issue tracking for construction projects." />
    <meta property="og:image" content="https://engineeringos-web.onrender.com/og-image.png" />
    <meta property="og:url" content="https://engineeringos-web.onrender.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Reality Capture by EngineeringOS" />
    <meta name="twitter:description" content="Site documentation, BIM coordination, and issue tracking for construction projects." />
    <meta name="twitter:image" content="https://engineeringos-web.onrender.com/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- A plain rel="stylesheet" link here would block first paint on a
         network round-trip to fonts.googleapis.com, even with preconnect
         (which cuts connection setup time but not the fetch itself). Loading
         it as a non-blocking preload and swapping its media to "all" once
         fetched (the standard loadCSS pattern) keeps the font stylesheet off
         the critical rendering path; font-display: swap (already in the
         URL) then shows fallback-font text immediately and swaps once this
         loads, rather than the page waiting on it to paint anything at all.
         The <noscript> fallback covers the rare case of JS disabled. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      />
    </noscript>
  </head>
  <body class="bg-base-950 text-ink-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
