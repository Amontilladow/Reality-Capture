databases:
  - name: engineeringos-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList:
      - source: 2.50.174.54/32
        description: TEMP - manual prod migration for self-registration approval flow, remove after use
      # api/ifc-service reach it over Render's private network regardless of this list

services:
  # ── Redis / Bull queue ──────────────────────────────────────────────────
  - type: keyvalue
    name: engineeringos-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: [] # no public internet access; api/ifc-service reach it over Render's private network

  # ── Backend API ──────────────────────────────────────────────────────────
  - type: web
    name: engineeringos-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: API_URL
        value: https://engineeringos-api.onrender.com
      - key: FRONTEND_URL
        value: https://engineeringos-web.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://engineeringos-web.onrender.com
      - key: DB_HOST
        sync: false # filled in manually from engineeringos-db's "Internal Database URL" host
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        fromDatabase:
          name: engineeringos-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: engineeringos-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: engineeringos-db
          property: password
      - key: DB_SSL
        value: "true"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: REDIS_HOST
        sync: false # filled in manually from engineeringos-redis's internal connection info
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: S3_ENDPOINT
        sync: false # filled in manually after creating the Cloudflare R2 bucket
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_PUBLIC_URL
        sync: false
      - key: S3_PRESIGN_EXPIRES_IN
        value: 3600
      - key: STRIPE_SECRET_KEY
        value: sk_test_placeholder
      - key: STRIPE_WEBHOOK_SECRET
        value: whsec_placeholder
      - key: AI_SERVICE_URL
        value: http://engineeringos-ai-service:8001

  # ── Vector DB for the AI assistant/search (RAG) ─────────────────────────
  # Private service ONLY -- never expose this publicly. It has no auth of
  # its own; only engineeringos-ai-service should be able to reach it.
  - type: pserv
    name: engineeringos-qdrant
    runtime: image
    image:
      url: docker.io/qdrant/qdrant:latest
    plan: starter
    region: oregon
    disk:
      name: qdrant-data
      mountPath: /qdrant/storage
      sizeGB: 5

  # ── AI assistant / RAG service ──────────────────────────────────────────
  # Private service ONLY -- /assistant, /search, /ingest trust whatever
  # company_id/project_id is in the request body with no authentication of
  # their own. engineeringos-api is what enforces "only your own company's
  # data" before ever calling this. A public URL here would let anyone
  # query any company's data directly, bypassing that check entirely.
  - type: pserv
    name: engineeringos-ai-service
    runtime: docker
    dockerfilePath: apps/ai-service/Dockerfile
    dockerContext: apps/ai-service
    plan: starter
    region: oregon
    envVars:
      - key: PORT
        value: 8001
      - key: DATABASE_URL
        fromDatabase:
          name: engineeringos-db
          property: connectionString
      - key: QDRANT_URL
        value: http://engineeringos-qdrant:6333
      - key: QDRANT_API_KEY
        value: ""
      - key: DEFAULT_LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false # must be set manually in the Render dashboard -- no key configured yet, /assistant will error until one is added
      - key: OPENAI_API_KEY
        sync: false
      - key: OLLAMA_URL
        value: "" # not deployed; leave unset in production
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false

  # ── IFC processing worker ───────────────────────────────────────────────
  - type: worker
    name: engineeringos-ifc-service
    runtime: docker
    dockerfilePath: apps/ifc-service/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3100
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        fromDatabase:
          name: engineeringos-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: engineeringos-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: engineeringos-db
          property: password
      - key: DB_SSL
        value: "true"
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_PRESIGN_EXPIRES_IN
        value: 3600

  # ── Frontend ─────────────────────────────────────────────────────────────
  - type: web
    name: engineeringos-web
    runtime: static
    buildCommand: npm install -g pnpm@11 && pnpm install --frozen-lockfile --filter web... && pnpm --filter @engineeringos/types build && pnpm --filter web build
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_BASE
        value: https://engineeringos-api.onrender.com/api/v1
      - key: NODE_VERSION
        value: "22"
      - key: PNPM_VERSION
        value: "11.15.1"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
