# Shared secrets are set per service in the Render dashboard (sync: false),
# not through an environment group: the engineeringos-internal-secrets group
# this file used to declare was never created, and the service-level
# "envVarGroups:" key that referenced it is not valid Blueprint syntax, which
# made every Blueprint sync fail.
#   INTERNAL_SERVICE_SECRET -- the same random value on engineeringos-api and
#     engineeringos-ai-service; the API presents it as X-Internal-Service-Secret
#     on every call and the AI service rejects any request without it.
#   DB_PASSWORD -- app_user's login password (migration 052), the same value on
#     engineeringos-api and engineeringos-ifc-service. Deliberately NOT the
#     database owner's credential (DB_MIGRATOR_* below), which bypasses RLS and
#     is only used to run migrations.

databases:
  - name: engineeringos-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList: [] # no public internet access; api/ifc-service reach it over Render's private network

services:
  # ── Redis / Bull queue ──────────────────────────────────────────────────
  - type: keyvalue
    name: engineeringos-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: [] # no public internet access; api/ifc-service reach it over Render's private network

  # ── Backend API ──────────────────────────────────────────────────────────
  - type: web
    name: engineeringos-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /api/v1/health
    # Runs once per deploy, in the new release's own image/environment,
    # before it takes traffic -- applies any pending SQL migrations
    # (apps/api/src/database/migrations/*.sql, tracked in the _migrations
    # table, safe to re-run). Previously this was a manual step a human had
    # to remember to run via a Render Shell after every deploy that shipped
    # a new migration; a forgotten run left new code querying tables that
    # didn't exist yet (e.g. Workforce Intelligence's first deploy).
    preDeployCommand: node apps/api/dist/database/run-migrations.js
    envVars:
      - key: INTERNAL_SERVICE_SECRET
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: API_URL
        value: https://engineeringos-api.onrender.com
      - key: FRONTEND_URL
        value: https://engineeringos-web.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://engineeringos-web.onrender.com
      - key: DB_HOST
        sync: false # filled in manually from engineeringos-db's "Internal Database URL" host
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        fromDatabase:
          name: engineeringos-db
          property: database
      # Runtime identity -- a narrowly-privileged, RLS-subject role (migration
      # 052), NOT the database's owner. DB_PASSWORD (set in the
      # dashboard, see the top of this file) is shared with
      # engineeringos-ifc-service so both connect as the same app_user.
      - key: DB_USER
        value: app_user
      # Owner/superuser credential, used ONLY by preDeployCommand's migration
      # run (run-migrations.ts prefers DB_MIGRATOR_* over DB_USER/DB_PASSWORD
      # when present) -- never by the running application itself.
      - key: DB_MIGRATOR_USER
        fromDatabase:
          name: engineeringos-db
          property: user
      - key: DB_MIGRATOR_PASSWORD
        fromDatabase:
          name: engineeringos-db
          property: password
      - key: DB_SSL
        value: "true"
      # Render's managed Postgres presents a self-signed certificate on its
      # internal/private network connection (confirmed live: a
      # rejectUnauthorized: true connection with this unset fails pre-deploy
      # migrations with DEPTH_ZERO_SELF_SIGNED_CERT, since there's no public
      # CA to chain to). database.module.ts/run-migrations.ts both already
      # verify against this when set -- it just needs a real value here.
      # To get it: open a Render Shell on this service (it's already inside
      # Render's private network, same as the running app) and run
      #   openssl s_client -starttls postgres -connect "$DB_HOST:$DB_PORT" -showcerts </dev/null 2>/dev/null | openssl x509 -outform PEM
      # then paste the full "-----BEGIN CERTIFICATE-----"..."-----END
      # CERTIFICATE-----" output (Render's env var editor accepts multi-line
      # values) as this var's value in the dashboard.
      - key: DB_CA_CERT
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      # RealityCapture's own AI provider (Reports/Risk AI briefings, the
      # Assistant's tool-routing/domain-guard classification -- see
      # modules/ai/providers/provider.factory.ts). Previously no AI_PROVIDER
      # or provider key was declared here at all, so every AI request from
      # this service failed closed with "No AI provider configured" --
      # Reports/Risk briefings always showed "unavailable" in production.
      # custom_openai_compatible points this at a third-party OpenAI-
      # compatible gateway rather than a provider's own API; CUSTOM_OPENAI_*
      # values are filled in manually in the Render dashboard, never
      # committed. CUSTOM_OPENAI_MODEL must match a model name that gateway
      # actually serves.
      - key: AI_PROVIDER
        value: custom_openai_compatible
      - key: CUSTOM_OPENAI_BASE_URL
        sync: false
      - key: CUSTOM_OPENAI_API_KEY
        sync: false
      - key: CUSTOM_OPENAI_MODEL
        sync: false
      # Phase 6 security fix: this was previously missing from render.yaml
      # entirely. CredentialEncryptionService (common/crypto/) -- which
      # encrypts Outlook/Gmail OAuth tokens and BYO AI provider keys at rest
      # -- fell back to a hardcoded placeholder passphrase whenever this was
      # unset, so every production deployment before this fix was silently
      # encrypting that data with a key visible in the source repo. The app
      # now refuses to boot without a real value here (config/app.config.ts).
      # API-only; ifc-service never touches this data, so it isn't shared.
      - key: CREDENTIAL_ENCRYPTION_KEY
        generateValue: true
      - key: REDIS_HOST
        sync: false # filled in manually from engineeringos-redis's internal connection info
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: S3_ENDPOINT
        sync: false # filled in manually after creating the Cloudflare R2 bucket
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_PUBLIC_URL
        sync: false
      - key: S3_PRESIGN_EXPIRES_IN
        value: 3600
      - key: STRIPE_SECRET_KEY
        value: sk_test_placeholder
      - key: STRIPE_WEBHOOK_SECRET
        value: whsec_placeholder
      # Generic SMTP, not tied to any one provider -- Gmail, SES, a
      # transactional provider's SMTP endpoint, or a regional one all speak
      # plain SMTP, so EmailService never needs to care which is configured.
      # Filled in manually in the Render dashboard once a provider/account is
      # actually chosen, same as S3_*/STRIPE_* above -- until then,
      # EmailService.sendPasswordResetEmail() throws (caught by
      # AuthService.forgotPassword(), which logs it and still returns success
      # to the caller) and "Forgot password" falls back to being delivered
      # only via Manage Members > Reset password (admin-assisted).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: AI_SERVICE_URL
        value: http://engineeringos-ai-service:8001
      # GIS Preparation runs inside engineeringos-ai-service (routers/gis_prep.py),
      # not as its own paid instance -- see apps/adm-gis-prep docs D-034.
      - key: GIS_PREP_SERVICE_URL
        value: http://engineeringos-ai-service:8001/gis-prep

  # ── Vector DB for the AI assistant/search (RAG) ─────────────────────────
  # Private service ONLY -- never expose this publicly. It has no auth of
  # its own; only engineeringos-ai-service should be able to reach it.
  - type: pserv
    name: engineeringos-qdrant
    runtime: image
    image:
      url: docker.io/qdrant/qdrant:latest
    plan: starter
    region: oregon
    disk:
      name: qdrant-data
      mountPath: /qdrant/storage
      sizeGB: 5

  # ── AI assistant / RAG service ──────────────────────────────────────────
  # Private service ONLY -- /assistant, /search, /ingest trust whatever
  # company_id/project_id is in the request body with no authentication of
  # their own. engineeringos-api is what enforces "only your own company's
  # data" before ever calling this. A public URL here would let anyone
  # query any company's data directly, bypassing that check entirely.
  - type: pserv
    name: engineeringos-ai-service
    runtime: docker
    dockerfilePath: apps/ai-service/Dockerfile
    # Repository root: the image also installs apps/adm-gis-prep.
    dockerContext: .
    plan: starter
    region: oregon
    envVars:
      - key: INTERNAL_SERVICE_SECRET
        sync: false
      - key: PORT
        value: 8001
      - key: DATABASE_URL
        fromDatabase:
          name: engineeringos-db
          property: connectionString
      - key: QDRANT_URL
        value: http://engineeringos-qdrant:6333
      - key: QDRANT_API_KEY
        value: ""
      # Switched from anthropic to custom_openai_compatible so the AI
      # Assistant (/assistant, this service) routes through the same
      # third-party gateway as apps/api's Reports/Risk AI briefings --
      # previously ANTHROPIC_API_KEY was never actually set here (see the
      # old comment this replaced), so /assistant had been failing closed
      # in production this whole time, same gap as apps/api.
      - key: DEFAULT_LLM_PROVIDER
        value: custom_openai_compatible
      - key: CUSTOM_OPENAI_BASE_URL
        sync: false
      - key: CUSTOM_OPENAI_API_KEY
        sync: false
      - key: CUSTOM_OPENAI_MODEL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false # kept as a manual fallback option; not used while DEFAULT_LLM_PROVIDER is custom_openai_compatible
      - key: OPENAI_API_KEY
        sync: false
      - key: OLLAMA_URL
        value: "" # not deployed; leave unset in production
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false

  # ── IFC processing worker ───────────────────────────────────────────────
  - type: worker
    name: engineeringos-ifc-service
    runtime: docker
    dockerfilePath: apps/ifc-service/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    envVars:
      - key: DB_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3100
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        fromDatabase:
          name: engineeringos-db
          property: database
      # Narrowly-privileged, RLS-subject role (migration 052) -- not the
      # database owner. DB_PASSWORD (set in the dashboard) is the
      # same shared value engineeringos-api uses, since this worker
      # never runs migrations itself and doesn't need owner-level access.
      - key: DB_USER
        value: app_user
      - key: DB_SSL
        value: "true"
      # Same self-signed-certificate requirement as engineeringos-api's
      # identical var above -- set it to the same PEM value (see that
      # entry's comment for how to obtain it).
      - key: DB_CA_CERT
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_PRESIGN_EXPIRES_IN
        value: 3600

  # ── Frontend ─────────────────────────────────────────────────────────────
  - type: web
    name: engineeringos-web
    runtime: static
    buildCommand: npm install -g pnpm@11 && pnpm install --frozen-lockfile --filter web... && pnpm --filter @engineeringos/types build && pnpm --filter web build
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_BASE
        value: https://engineeringos-api.onrender.com/api/v1
      - key: NODE_VERSION
        value: "22"
      - key: PNPM_VERSION
        value: "11.15.1"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Browser security headers for the SPA (the API sets its own via helmet()).
    # CSP is deliberately limited to the directives that can't break the app
    # (no script/connect-src allowlist, which would need to track the API,
    # R2 presigned-URL and web-ifc WASM origins): it blocks framing
    # (clickjacking), <base> hijacking, plugins and off-site form posts.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
