name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Install, typecheck, test, build, lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must be on PATH before actions/setup-node's cache: 'pnpm'
      # option can resolve the store path.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # No production secrets and no live Postgres/Redis/S3/Qdrant/AI
      # credentials are required for any of the checks below -- every unit
      # test in this repo mocks its DB/storage/queue dependencies rather
      # than hitting real infrastructure. See CURRENT_STATUS.md for what
      # that leaves unverified (RLS under a real restricted DB role,
      # browser-level rendering, IFC pipeline performance at scale).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # install's own postinstall hook already runs this, but it's kept as
      # an explicit, independently-inspectable step so a change to that
      # hook can't silently drop typecheck's dependency on it.
      - name: Build @engineeringos/types
        run: pnpm --filter @engineeringos/types build

      # Recursive across every workspace package that declares a typecheck
      # script: packages/types, apps/api, apps/ifc-service, apps/mobile,
      # apps/agent. apps/web has no standalone typecheck script -- its
      # tsc -b check is folded into the build step below instead.
      # apps/browser-extension and tools/bim-debug have no TypeScript
      # source to typecheck.
      - name: Typecheck
        run: pnpm typecheck

      # Recursive across every workspace package that declares a test
      # script: apps/api (Jest), apps/ifc-service (Jest), apps/agent
      # (node:test via tsx), apps/browser-extension (node:test),
      # tools/bim-debug (Jest -- its one spec self-skips without a real
      # customer IFC file at BIM_DEBUG_SOURCE_IFC; see the file's own
      # header comment). apps/web and apps/mobile have no test script yet
      # -- see CURRENT_STATUS.md's browser-verification-gap note.
      - name: Test
        run: pnpm test

      # Builds packages/types, then apps/api, apps/ifc-service, and
      # apps/web (the only apps with a build script). apps/web's build
      # includes `tsc -b`, which is this repo's only standalone typecheck
      # of the web app's own source.
      - name: Build
        run: pnpm build

      # Recursive across apps/api and apps/web (the only two with a lint
      # script). Real errors fail this step -- no `|| true`, no
      # --max-warnings override. Pre-existing warnings (not errors) in
      # apps/web are left as-is; see CURRENT_STATUS.md.
      - name: Lint
        run: pnpm lint

      # Security audit (2026-10-29 pass, H-3 in KNOWN_ISSUES_AND_REMEDIATION.md):
      # deliberately non-blocking (|| true) for now -- the current baseline
      # already has known, triaged findings (sharp/nodemailer/xlsx each need
      # their own dedicated major-version upgrade pass, tracked in that doc)
      # that would turn every unrelated PR's CI red today. This step exists
      # so a *new* critical/high finding is visible in every run's log
      # without blocking merges on pre-existing, already-accepted risk.
      # Tighten this to a real gate (drop the `|| true`, or add
      # --audit-level/an allowlist of the already-tracked findings) once the
      # baseline above is cleared.
      - name: Dependency audit (Node, non-blocking)
        run: pnpm audit --prod || true

  python-dependency-audit:
    name: Python dependency audit (adm-gis-prep, non-blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # apps/adm-gis-prep only -- its full dependency set installs cleanly
      # and pip-audit returned zero findings against it in the 2026-10-29
      # pass. apps/ai-service is deliberately NOT audited here: it pins
      # torch via a separate --extra-index-url (download.pytorch.org),
      # which made full-environment resolution unreliable in the sandbox
      # this was authored in -- that service's dependency audit (which did
      # surface real findings: Pillow, python-multipart, sentence-
      # transformers) was done manually this pass via an isolated venv with
      # each package installed --no-deps; see H-3 in
      # KNOWN_ISSUES_AND_REMEDIATION.md for the full results. Wiring
      # apps/ai-service into this job is a reasonable follow-up once
      # someone can confirm it resolves cleanly in GitHub Actions' own
      # (non-sandboxed) network.
      - name: Install pip-audit
        run: pip install --quiet pip-audit

      - name: Audit apps/adm-gis-prep
        working-directory: apps/adm-gis-prep
        run: pip-audit -r requirements.txt || true
