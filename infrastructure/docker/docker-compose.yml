version: '3.9'

# EngineeringOS™ Reality Capture — Local Development Stack
# Architecture Specification v1.1
#
# Services:
#   postgres  — primary database (port 5432)
#   redis     — queues + cache (port 6379)
#   minio     — S3-compatible storage (port 9000, console 9001)
#   qdrant    — vector database for AI layer (port 6333)
#
# Run: docker compose up -d
# Stop: docker compose down
# Reset data: docker compose down -v

services:
  postgres:
    image: postgres:16-alpine
    container_name: engineeringos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: engineeringos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Allow the API to set session-level config vars (required for RLS tenant isolation)
      POSTGRES_INITDB_ARGS: '--auth-host=md5'
    ports:
      # Host 5433, not 5432 -- this machine already has a separate, unrelated
      # native PostgreSQL install bound to 5432 (used for offline forensic
      # work against restored backups). Remapping here avoids a port
      # conflict rather than touching that unrelated service. Update
      # apps/api/.env.local's DB_PORT to match if you copy this.
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Auto-run the initial migration on first start
      - ./apps/api/src/database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d engineeringos']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: engineeringos-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: engineeringos-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'  # S3 API
      - '9001:9001'  # MinIO Console (browser UI)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: engineeringos-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb local/engineeringos --ignore-existing;
        mc anonymous set download local/engineeringos/public;
        echo 'MinIO bucket engineeringos created';
      "
    restart: on-failure

  qdrant:
    image: qdrant/qdrant:latest
    container_name: engineeringos-qdrant
    restart: unless-stopped
    ports:
      - '6333:6333'  # REST API
      - '6334:6334'  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: '6334'
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:6333/readyz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build: ./apps/ai-service
    container_name: engineeringos-ai
    restart: unless-stopped
    ports:
      - '8001:8001'
    env_file:
      - ./apps/ai-service/.env
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/engineeringos
      S3_ENDPOINT: http://minio:9000
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_data:
